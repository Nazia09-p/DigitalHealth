<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Disease Prediction Model</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 80px;
      padding: 20px;
    }

    .gallery-grid img, .gallery-grid .folder {
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      padding: 20px;
      background: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      color: #111;
      transition: 0.3s;
    }

    .gallery-grid img:hover, .gallery-grid .folder:hover {
      transform: scale(1.05);
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #lightbox img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 10px;
    }

    .back-button {
      margin: 20px;
      cursor: pointer;
      display: inline-block;
      padding: 10px 20px;
      background: #111;
      color: white;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">Human Adaptive Cyber Physical</div>
  <nav class="nav" id="navbar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="members.html">Members</a>
    <a href="project.html">Project</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>
  <div class="menu-icon" onclick="toggleMenu()">☰</div>
</header>

<section class="page-section">
  <h1>Gallery</h1>

  <div id="gallery" class="gallery-grid"></div>
  <div id="backBtn" class="back-button" style="display:none;" onclick="showFolders()">← Back to Folders</div>
</section>

<!-- Lightbox overlay -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img">
</div>

<script>
  // Folders and images mapping
  const galleryData = {
    "Event 1": ["images/event1/a.jpg", "images/event1/b.jpg", "images/event1/c.jpg"],
    "Event 2": ["images/event2/a.jpg", "images/event2/img2.jpg"],
    "Event 3": ["images/event3/a.jpg", "images/event3/b.jpg", "images/event3/c.jpg"]
  };

  const galleryDiv = document.getElementById("gallery");
  const backBtn = document.getElementById("backBtn");

  // Show folders initially
  function showFolders() {
    galleryDiv.innerHTML = "";
    backBtn.style.display = "none";

    for (let folderName in galleryData) {
      const folderDiv = document.createElement("div");
      folderDiv.className = "folder";
      folderDiv.textContent = folderName;
      folderDiv.onclick = () => showEventImages(folderName);
      galleryDiv.appendChild(folderDiv);
    }
  }

  // Show images for a folder/event
  function showEventImages(folderName) {
    galleryDiv.innerHTML = "";
    backBtn.style.display = "inline-block";

    galleryData[folderName].forEach(src => {
      const img = document.createElement("img");
      img.src = src;
      img.onclick = () => openLightbox(src);
      galleryDiv.appendChild(img);
    });
  }

  // Lightbox functions
  function openLightbox(src){
    document.getElementById("lightbox-img").src = src;
    document.getElementById("lightbox").style.display = "flex";
  }

  function closeLightbox(){
    document.getElementById("lightbox").style.display = "none";
  }

  // Initialize gallery
  showFolders();
</script>



<script src="js/main.js"></script>
</body>
</html>
